<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 426.615 760" width="533" height="950" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  text { font-family: ui-monospace, Menlo, Consolas, "Liberation Mono", "Courier New", monospace; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="Extension" x1="76.615" y1="70" x2="76.615" y2="730" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Broker" x1="216.615" y1="70" x2="216.615" y2="730" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Client" x1="356.615" y1="70" x2="356.615" y2="730" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Extension" data-to="Broker" data-label="hello: public key, last seq" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="76.615" y1="90" x2="216.615" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="146.615" y="80" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">hello: public key, last seq</text>
</g>
<g class="message" data-from="Broker" data-to="Extension" data-label="welcome: grant, resume point" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="216.615" y1="130" x2="76.615" y2="130" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="146.615" y="120" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">welcome: grant, resume point</text>
</g>
<g class="message" data-from="Client" data-to="Broker" data-label="hello: public key, last seq" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="356.615" y1="170" x2="216.615" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="286.615" y="160" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">hello: public key, last seq</text>
</g>
<g class="message" data-from="Broker" data-to="Client" data-label="welcome: replay from the ring" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="216.615" y1="210" x2="356.615" y2="210" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="286.615" y="200" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">welcome: replay from the ring</text>
</g>
<g class="message" data-from="Client" data-to="Broker" data-label="subscribe mail.compose.read" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="356.615" y1="250" x2="216.615" y2="250" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="286.615" y="240" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">subscribe mail.compose.read</text>
</g>
<g class="message" data-from="Broker" data-to="Client" data-label="subscribed" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="216.615" y1="290" x2="356.615" y2="290" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="286.615" y="280" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">subscribed</text>
</g>
<g class="message" data-from="Extension" data-to="Broker" data-label="publish, sealed" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="76.615" y1="330" x2="216.615" y2="330" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="146.615" y="320" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">publish, sealed</text>
</g>
<g class="message" data-from="Broker" data-to="Client" data-label="publish, still sealed" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="216.615" y1="370" x2="356.615" y2="370" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="286.615" y="360" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">publish, still sealed</text>
</g>
<g class="message" data-from="Client" data-to="Broker" data-label="call, sealed" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="356.615" y1="410" x2="216.615" y2="410" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="286.615" y="400" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">call, sealed</text>
</g>
<g class="message" data-from="Broker" data-to="Extension" data-label="call" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="216.615" y1="450" x2="76.615" y2="450" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="146.615" y="440" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">call</text>
</g>
<g class="message" data-from="Extension" data-to="Broker" data-label="result, sealed" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="76.615" y1="490" x2="216.615" y2="490" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="146.615" y="480" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">result, sealed</text>
</g>
<g class="message" data-from="Broker" data-to="Client" data-label="result" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="216.615" y1="530" x2="356.615" y2="530" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="286.615" y="520" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">result</text>
</g>
<g class="message" data-from="Client" data-to="Broker" data-label="subscribe outside the grant" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="356.615" y1="570" x2="216.615" y2="570" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="286.615" y="560" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">subscribe outside the grant</text>
</g>
<g class="message" data-from="Broker" data-to="Client" data-label="error scope_denied" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="216.615" y1="610" x2="356.615" y2="610" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="286.615" y="600" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">error scope_denied</text>
</g>
<g class="message" data-from="Client" data-to="Broker" data-label="ping every 20 seconds" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="356.615" y1="650" x2="216.615" y2="650" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="286.615" y="640" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">ping every 20 seconds</text>
</g>
<g class="message" data-from="Broker" data-to="Client" data-label="pong" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="216.615" y1="690" x2="356.615" y2="690" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="286.615" y="680" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">pong</text>
</g>
<g class="actor" data-id="Extension" data-label="Extension" data-type="participant">
  <rect x="30" y="30" width="93.22999999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="76.615" y="50" font-size="10.4" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Extension</text>
</g>
<g class="actor" data-id="Broker" data-label="Broker" data-type="participant">
  <rect x="176.615" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="216.615" y="50" font-size="10.4" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Broker</text>
</g>
<g class="actor" data-id="Client" data-label="Client" data-type="participant">
  <rect x="316.615" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="356.615" y="50" font-size="10.4" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Client</text>
</g>
</svg>