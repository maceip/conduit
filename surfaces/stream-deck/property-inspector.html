<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Conduit key</title>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        margin: 12px;
        color: #2c2c2c;
      }
      h2 {
        font-size: 13px;
        margin: 0 0 8px 0;
      }
      code {
        background: #f2f2f2;
        padding: 1px 3px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <h2>Conduit key</h2>
    <p>
      Pressing this key publishes the press to a Conduit near end, which
      seals it and sends it on to a Conduit client. The key never sees a
      secret of its own.
    </p>
    <p>
      The near end is told to the plugin in the
      <code>CONDUIT_SOCKET</code> environment variable of the Stream
      Deck application.
    </p>
  </body>
</html>
