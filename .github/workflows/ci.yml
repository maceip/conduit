name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: fmt, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: The schemas are JSON
        run: |
          python3 - <<'PY'
          import glob, json, sys
          for path in glob.glob("spec/**/*.json", recursive=True):
              with open(path) as handle:
                  json.load(handle)
              print("ok", path)
          PY

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup component add cargo-llvm-cov
          rustup default stable
      - name: Coverage
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
