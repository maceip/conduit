name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: fmt, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: The extension clients parse
        run: |
          for file in clients/shared/*.js clients/chromium-mv3/popup.js clients/safari-mv3/popup.js scripts/build-extension.mjs scripts/e2e/run.mjs; do
            node --check "$file"
            echo "ok $file"
          done

      - name: The tests of the extension
        run: node --test clients/shared/*.test.js

      - name: The schemas are JSON
        run: |
          python3 - <<'PY'
          import glob, json
          for path in glob.glob("spec/**/*.json", recursive=True):
              with open(path) as handle:
                  json.load(handle)
              print("ok", path)
          for path in glob.glob("clients/*/manifest.json"):
              with open(path) as handle:
                  manifest = json.load(handle)
              assert manifest["manifest_version"] == 3, path
              assert "background" in manifest, path
              print("ok", path)
          PY

  browser:
    name: the browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the browser
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: The sealing agrees with the Rust, in a real browser
        run: node scripts/browser-test.mjs

  e2e:
    name: end to end (broker + chromium extension + rust client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: The whole system, nothing mocked
        env:
          E2E_INSTALL_DEPS: "1"
        run: scripts/e2e/run.sh

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: target/e2e/

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
