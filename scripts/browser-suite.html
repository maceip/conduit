<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Conduit browser tests</title>
  </head>
  <body>
    <p id="state">running…</p>
    <pre id="log"></pre>
    <script type="module">
      /*
       * The checks that need a real browser.
       *
       * The vector is the one the Rust prints: the same two secret keys,
       * the same nonce prefix, the same sequence number, the same
       * payload, and therefore the same ciphertext.  If the browser and
       * the Rust disagree about how a key is derived or how a nonce is
       * built, this fails.
       */
      import { agree, keyPairFromSecret, seal, toBase64Url } from "/clients/shared/sealing.js";

      const ONE_SECRET = "0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20";
      const TWO_SECRET = "2122232425262728292a2b2c2d2e2f303132333435363738393a3b3c3d3e3f40";
      const ONE_PUBLIC = "04515c3d6eb9e396b904d3feca7f54fdcd0cc1e997bf375dca515ad0a6c3b4035f4536be3a50f318fbf9a5475902a221502bef0d57e08c53b2cc0a56f17d9f9354";
      const TWO_PUBLIC = "041f140146bfb1b251f84f4ddbe0d4cdcfd77afd984a9520e35794021f8312bb9eec995a08b1fa7704df3dcc0b50a9665263fb7711f95f9f8a449c5096e47c892b";
      const SEALED = "q9rhXAyOIxxxfqaOxOdhv6nEUmkWAS8";
      const PREFIX = new Uint8Array([0xde, 0xad, 0xbe, 0xef]);

      function hex(bytes) {
        return [...new Uint8Array(bytes)]
          .map((byte) => byte.toString(16).padStart(2, "0"))
          .join("");
      }

      function hexBytes(text) {
        const bytes = new Uint8Array(text.length / 2);
        for (let index = 0; index < bytes.length; index += 1) {
          bytes[index] = parseInt(text.slice(index * 2, index * 2 + 2), 16);
        }
        return bytes;
      }

      const results = [];

      function check(name, condition, detail) {
        results.push({ name, ok: !!condition, detail: detail || "" });
      }

      let step = "the first import";
      try {
        const one = await keyPairFromSecret(hexBytes(ONE_SECRET), hexBytes(ONE_PUBLIC));
        step = "the second import";
        check("the public key of the first secret", hex(one.publicBytes) === ONE_PUBLIC, hex(one.publicBytes));

        const two = await keyPairFromSecret(hexBytes(TWO_SECRET), hexBytes(TWO_PUBLIC));
        check("the public key of the second secret", hex(two.publicBytes) === TWO_PUBLIC, hex(two.publicBytes));

        step = "the agreement";
        const shared = await agree(one.privateKey, two.publicBytes);
        step = "the sealing";
        const sealed = await seal(shared.toExtension, PREFIX, 1, "conduit");
        const text = toBase64Url(sealed);
        check("the sealed payload is the one the Rust seals", text === SEALED, text);

        const other = await agree(two.privateKey, one.publicBytes);
        check(
          "the two ends agree on the key",
          hex(shared.toExtension) === hex(other.toExtension),
          hex(shared.toExtension),
        );
        check(
          "the two directions do not share a key",
          hex(shared.toExtension) !== hex(shared.toClient),
          "",
        );
      } catch (error) {
        results.push({
          name: "the checks ran",
          ok: false,
          detail: `${step}: ${String(error && error.message)}`,
        });
      }

      const failed = results.filter((result) => !result.ok);
      document.getElementById("state").textContent = failed.length
        ? `${failed.length} of ${results.length} failed`
        : `${results.length} passed`;
      document.getElementById("log").textContent = results
        .map((result) => `${result.ok ? "ok  " : "FAIL"} ${result.name} ${result.detail}`)
        .join("\n");

      window.__conduitResults = results;
      window.__conduitDone = true;
    </script>
  </body>
</html>
