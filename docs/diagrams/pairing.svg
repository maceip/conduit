<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424.0215 360" width="530" height="450" style="--bg:#E4E4E7;--fg:#18181B;--line:#27272A;--muted:#27272A;--surface:#F4F4F5;--border:#3F3F46">
<style>
  text { font-family: ui-monospace, Menlo, Consolas, "Liberation Mono", "Courier New", monospace; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<rect x="0" y="0" width="100%" height="100%" rx="18" ry="18" fill="#E4E4E7"/>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1.75" />
  </marker>
</defs>
<line class="lifeline" data-actor="near-end" x1="74.0215" y1="70" x2="74.0215" y2="330" stroke="var(--_line)" stroke-width="1.31" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="broker" x1="214.0215" y1="70" x2="214.0215" y2="330" stroke="var(--_line)" stroke-width="1.31" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="user" x1="354.0215" y1="70" x2="354.0215" y2="330" stroke="var(--_line)" stroke-width="1.31" stroke-dasharray="6 4" />
<g class="message" data-from="near-end" data-to="broker" data-label="POST /v1/device/code" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="74.0215" y1="90" x2="214.0215" y2="90" stroke="var(--_line)" stroke-width="1.75" marker-end="url(#seq-arrow)" />
  <text x="144.0215" y="80" font-size="8.8" text-anchor="middle" font-weight="600" fill="var(--_text-muted)" dy="3.8499999999999996">POST /v1/device/code</text>
</g>
<g class="message" data-from="broker" data-to="near-end" data-label="code + url (10m)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="214.0215" y1="130" x2="74.0215" y2="130" stroke="var(--_line)" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="144.0215" y="120" font-size="8.8" text-anchor="middle" font-weight="600" fill="var(--_text-muted)" dy="3.8499999999999996">code + url (10m)</text>
</g>
<g class="message" data-from="near-end" data-to="user" data-label="show code" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="74.0215" y1="170" x2="354.0215" y2="170" stroke="var(--_line)" stroke-width="1.75" marker-end="url(#seq-arrow)" />
  <text x="214.0215" y="160" font-size="8.8" text-anchor="middle" font-weight="600" fill="var(--_text-muted)" dy="3.8499999999999996">show code</text>
</g>
<g class="message" data-from="user" data-to="broker" data-label="approve on page" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="354.0215" y1="210" x2="214.0215" y2="210" stroke="var(--_line)" stroke-width="1.75" marker-end="url(#seq-arrow)" />
  <text x="284.0215" y="200" font-size="8.8" text-anchor="middle" font-weight="600" fill="var(--_text-muted)" dy="3.8499999999999996">approve on page</text>
</g>
<g class="message" data-from="near-end" data-to="broker" data-label="POST /v1/device/secret" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="74.0215" y1="250" x2="214.0215" y2="250" stroke="var(--_line)" stroke-width="1.75" marker-end="url(#seq-arrow)" />
  <text x="144.0215" y="240" font-size="8.8" text-anchor="middle" font-weight="600" fill="var(--_text-muted)" dy="3.8499999999999996">POST /v1/device/secret</text>
</g>
<g class="message" data-from="broker" data-to="near-end" data-label="256-bit secret" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="214.0215" y1="290" x2="74.0215" y2="290" stroke="var(--_line)" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="144.0215" y="280" font-size="8.8" text-anchor="middle" font-weight="600" fill="var(--_text-muted)" dy="3.8499999999999996">256-bit secret</text>
</g>
<g class="actor" data-id="near-end" data-label="near-end" data-type="participant">
  <rect x="30.000000000000007" y="30" width="88.04299999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="74.0215" y="50" font-size="10.4" text-anchor="middle" font-weight="700" fill="var(--_text)" dy="4.55">near-end</text>
</g>
<g class="actor" data-id="broker" data-label="broker" data-type="participant">
  <rect x="174.0215" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="214.0215" y="50" font-size="10.4" text-anchor="middle" font-weight="700" fill="var(--_text)" dy="4.55">broker</text>
</g>
<g class="actor" data-id="user" data-label="user" data-type="participant">
  <rect x="314.0215" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="354.0215" y="50" font-size="10.4" text-anchor="middle" font-weight="700" fill="var(--_text)" dy="4.55">user</text>
</g>
</svg>