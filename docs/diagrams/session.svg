<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 425.874 480" width="532" height="600" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  text { font-family: ui-monospace, Menlo, Consolas, "Liberation Mono", "Courier New", monospace; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="extension" x1="75.874" y1="70" x2="75.874" y2="450" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="broker" x1="215.874" y1="70" x2="215.874" y2="450" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="client" x1="355.874" y1="70" x2="355.874" y2="450" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="extension" data-to="broker" data-label="hello: key, last seq" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="75.874" y1="90" x2="215.874" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="145.874" y="80" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">hello: key, last seq</text>
</g>
<g class="message" data-from="client" data-to="broker" data-label="hello: key, last seq" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="355.874" y1="130" x2="215.874" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="285.874" y="120" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">hello: key, last seq</text>
</g>
<g class="message" data-from="broker" data-to="client" data-label="welcome + missed frames" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="215.874" y1="170" x2="355.874" y2="170" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="285.874" y="160" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">welcome + missed frames</text>
</g>
<g class="message" data-from="extension" data-to="broker" data-label="publish, sealed" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="75.874" y1="210" x2="215.874" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="145.874" y="200" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">publish, sealed</text>
</g>
<g class="message" data-from="broker" data-to="client" data-label="publish, still sealed" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="215.874" y1="250" x2="355.874" y2="250" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="285.874" y="240" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">publish, still sealed</text>
</g>
<g class="message" data-from="client" data-to="broker" data-label="call, sealed" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="355.874" y1="290" x2="215.874" y2="290" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="285.874" y="280" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">call, sealed</text>
</g>
<g class="message" data-from="broker" data-to="extension" data-label="call" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="215.874" y1="330" x2="75.874" y2="330" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="145.874" y="320" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">call</text>
</g>
<g class="message" data-from="extension" data-to="broker" data-label="result, sealed" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="75.874" y1="370" x2="215.874" y2="370" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="145.874" y="360" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">result, sealed</text>
</g>
<g class="message" data-from="broker" data-to="client" data-label="result" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="215.874" y1="410" x2="355.874" y2="410" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="285.874" y="400" font-size="8.8" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">result</text>
</g>
<g class="actor" data-id="extension" data-label="extension" data-type="participant">
  <rect x="29.999999999999993" y="30" width="91.748" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="75.874" y="50" font-size="10.4" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">extension</text>
</g>
<g class="actor" data-id="broker" data-label="broker" data-type="participant">
  <rect x="175.874" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="215.874" y="50" font-size="10.4" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">broker</text>
</g>
<g class="actor" data-id="client" data-label="client" data-type="participant">
  <rect x="315.874" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="355.874" y="50" font-size="10.4" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">client</text>
</g>
</svg>