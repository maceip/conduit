[package]
name = "conduit-near-end"
description = "The near end of a conduit tunnel: a process that holds the socket of one or more surfaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "conduit-near-end"
path = "src/main.rs"

[dependencies]
conduit-protocol = { path = "../conduit-protocol" }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
conduit-broker = { path = "../conduit-broker" }
conduit-client = { path = "../conduit-client" }
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
