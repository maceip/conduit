name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "spec/**"
      - "scripts/pages-readme.sh"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    name: the documents
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Install mermaid-ascii
        run: |
          curl -sSfL https://github.com/AlexanderGrooff/mermaid-ascii/releases/download/1.6.2/mermaid-ascii_Linux_x86_64.tar.gz | tar xz -C /usr/local/bin mermaid-ascii
          mermaid-ascii --help > /dev/null
      - name: Build the documents
        run: |
          mkdir -p _site
          # On the site the diagrams are text, drawn by mermaid-ascii.
          sh scripts/pages-readme.sh > "$RUNNER_TEMP/README.md"
          pandoc "$RUNNER_TEMP/README.md" --standalone --include-in-header=docs/head.html --metadata pagetitle=conduit -o _site/index.html
          for file in docs/*.md docs/research/*.md; do
            out="_site/${file%.md}.html"
            mkdir -p "$(dirname "$out")"
            pandoc "$file" --standalone --include-in-header=docs/head.html --metadata pagetitle=conduit -o "$out"
          done
          cp -r spec _site/spec
          cp docs/social-preview-rounded.png _site/docs/
          # The links in the documents point at the markdown; the site
          # serves the HTML.  The links to the code point at GitHub.
          python3 scripts/pages-links.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
