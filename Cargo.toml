[workspace]
resolver = "2"
members = [
    "crates/conduit-protocol",
    "crates/conduit-broker",
    "crates/conduit-client",
    "crates/conduit-native-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maceip/conduit"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
