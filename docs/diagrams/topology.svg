  <rect x="161.51799999999997" y="42.45" width="74.08000000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="none" />
  <text x="198.558" y="57.6" text-anchor="middle" font-size="8.8" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">plain frames</text>
