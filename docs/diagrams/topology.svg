<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 641.442 117.6" width="802" height="147" style="--bg:#E4E4E7;--fg:#18181B;--line:#27272A;--muted:#27272A;--surface:#F4F4F5;--border:#3F3F46">
<style>
  text { font-family: ui-monospace, Menlo, Consolas, "Liberation Mono", "Courier New", monospace; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<rect x="0" y="0" width="100%" height="100%" rx="18" ry="18" fill="#E4E4E7"/>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="S" data-to="B" data-style="solid" data-arrow-start="true" data-arrow-end="true" data-label="sealed wss" points="127.892,58.45 286.408,58.45" fill="none" stroke="var(--_line)" stroke-width="1.75" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-start)" />
<polyline class="edge" data-from="B" data-to="C" data-style="solid" data-arrow-start="true" data-arrow-end="true" data-label="sealed wss" points="369.854,58.45 528.37,58.45" fill="none" stroke="var(--_line)" stroke-width="1.75" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-start)" />
<g class="edge-label" data-from="S" data-to="B" data-label="sealed wss">
  <rect x="171.892" y="42.45" width="70.516" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="none" />
  <text x="207.15" y="57.6" text-anchor="middle" font-size="8.8" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">sealed wss</text>
</g>
<g class="edge-label" data-from="B" data-to="C" data-label="sealed wss">
  <rect x="413.854" y="42.45" width="70.516" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="none" />
  <text x="449.11199999999997" y="57.6" text-anchor="middle" font-size="8.8" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">sealed wss</text>
</g>
<g class="node" data-id="S" data-label="surface" data-shape="rectangle">
  <rect x="40" y="40" width="87.892" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.31" />
  <text x="83.946" y="58.45" text-anchor="middle" font-size="10.4" font-weight="700" fill="var(--_text)" dy="4.55">surface</text>
</g>
<g class="node" data-id="B" data-label="broker" data-shape="rectangle">
  <rect x="286.408" y="40" width="83.446" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.31" />
  <text x="328.13100000000003" y="58.45" text-anchor="middle" font-size="10.4" font-weight="700" fill="var(--_text)" dy="4.55">broker</text>
</g>
<g class="node" data-id="C" data-label="client" data-shape="rectangle">
  <rect x="528.37" y="40" width="73.072" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.31" />
  <text x="564.906" y="58.45" text-anchor="middle" font-size="10.4" font-weight="700" fill="var(--_text)" dy="4.55">client</text>
</g>
</svg>