<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="700" height="650" style="--bg:#E4E4E7;--fg:#18181B;--line:#27272A;--muted:#27272A;--surface:#F4F4F5;--border:#3F3F46">
<style>
  text { font-family: ui-monospace, Menlo, Consolas, "Liberation Mono", "Courier New", monospace; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<rect x="0" y="0" width="100%" height="100%" rx="18" ry="18" fill="#E4E4E7"/>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1.75" />
  </marker>
</defs>
<line class="lifeline" data-actor="plugin" x1="70" y1="70" x2="70" y2="490" stroke="var(--_line)" stroke-width="1.31" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="near-end" x1="210" y1="70" x2="210" y2="490" stroke="var(--_line)" stroke-width="1.31" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="broker" x1="350" y1="70" x2="350" y2="490" stroke="var(--_line)" stroke-width="1.31" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="client" x1="490" y1="70" x2="490" y2="490" stroke="var(--_line)" stroke-width="1.31" stroke-dasharray="6 4" />
<g class="message" data-from="near-end" data-to="broker" data-label="hello (p256 key)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="90" x2="350" y2="90" stroke="var(--_line)" stroke-width="1.75" marker-end="url(#seq-arrow)" />
  <text x="280" y="80" font-size="8.8" text-anchor="middle" font-weight="600" fill="var(--_text-muted)" dy="3.8499999999999996">hello (p256 key)</text>
</g>
<g class="message" data-from="client" data-to="broker" data-label="hello (p256 key)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="490" y1="130" x2="350" y2="130" stroke="var(--_line)" stroke-width="1.75" marker-end="url(#seq-arrow)" />
  <text x="420" y="120" font-size="8.8" text-anchor="middle" font-weight="600" fill="var(--_text-muted)" dy="3.8499999999999996">hello (p256 key)</text>
</g>
<g class="message" data-from="broker" data-to="client" data-label="welcome + peer hello" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="350" y1="170" x2="490" y2="170" stroke="var(--_line)" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="420" y="160" font-size="8.8" text-anchor="middle" font-weight="600" fill="var(--_text-muted)" dy="3.8499999999999996">welcome + peer hello</text>
</g>
<g class="message" data-from="client" data-to="broker" data-label="subscribe (scopes)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="490" y1="210" x2="350" y2="210" stroke="var(--_line)" stroke-width="1.75" marker-end="url(#seq-arrow)" />
  <text x="420" y="200" font-size="8.8" text-anchor="middle" font-weight="600" fill="var(--_text-muted)" dy="3.8499999999999996">subscribe (scopes)</text>
</g>
<g class="message" data-from="broker" data-to="client" data-label="subscribed" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="350" y1="250" x2="490" y2="250" stroke="var(--_line)" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="420" y="240" font-size="8.8" text-anchor="middle" font-weight="600" fill="var(--_text-muted)" dy="3.8499999999999996">subscribed</text>
</g>
<g class="message" data-from="plugin" data-to="near-end" data-label="publish (plain json)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="290" x2="210" y2="290" stroke="var(--_line)" stroke-width="1.75" marker-end="url(#seq-arrow)" />
  <text x="140" y="280" font-size="8.8" text-anchor="middle" font-weight="600" fill="var(--_text-muted)" dy="3.8499999999999996">publish (plain json)</text>
</g>
<g class="message" data-from="near-end" data-to="broker" data-label="publish (sealed p)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="330" x2="350" y2="330" stroke="var(--_line)" stroke-width="1.75" marker-end="url(#seq-arrow)" />
  <text x="280" y="320" font-size="8.8" text-anchor="middle" font-weight="600" fill="var(--_text-muted)" dy="3.8499999999999996">publish (sealed p)</text>
</g>
<g class="message" data-from="broker" data-to="client" data-label="publish (still sealed)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="350" y1="370" x2="490" y2="370" stroke="var(--_line)" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="420" y="360" font-size="8.8" text-anchor="middle" font-weight="600" fill="var(--_text-muted)" dy="3.8499999999999996">publish (still sealed)</text>
</g>
<g class="message" data-from="client" data-to="broker" data-label="call (sealed p)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="490" y1="410" x2="350" y2="410" stroke="var(--_line)" stroke-width="1.75" marker-end="url(#seq-arrow)" />
  <text x="420" y="400" font-size="8.8" text-anchor="middle" font-weight="600" fill="var(--_text-muted)" dy="3.8499999999999996">call (sealed p)</text>
</g>
<g class="message" data-from="broker" data-to="near-end" data-label="call (still sealed)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="350" y1="450" x2="210" y2="450" stroke="var(--_line)" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="280" y="440" font-size="8.8" text-anchor="middle" font-weight="600" fill="var(--_text-muted)" dy="3.8499999999999996">call (still sealed)</text>
</g>
<g class="actor" data-id="plugin" data-label="plugin" data-type="participant">
  <rect x="30" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="70" y="50" font-size="10.4" text-anchor="middle" font-weight="700" fill="var(--_text)" dy="4.55">plugin</text>
</g>
<g class="actor" data-id="near-end" data-label="near-end" data-type="participant">
  <rect x="165.9785" y="30" width="88.04299999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="210" y="50" font-size="10.4" text-anchor="middle" font-weight="700" fill="var(--_text)" dy="4.55">near-end</text>
</g>
<g class="actor" data-id="broker" data-label="broker" data-type="participant">
  <rect x="310" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="350" y="50" font-size="10.4" text-anchor="middle" font-weight="700" fill="var(--_text)" dy="4.55">broker</text>
</g>
<g class="actor" data-id="client" data-label="client" data-type="participant">
  <rect x="450" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1.75" />
  <text x="490" y="50" font-size="10.4" text-anchor="middle" font-weight="700" fill="var(--_text)" dy="4.55">client</text>
</g>
</svg>