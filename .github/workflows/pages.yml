name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "spec/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    name: the documents
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Build the documents
        run: |
          mkdir -p _site
          pandoc README.md --standalone --metadata title=Conduit -o _site/index.html
          for file in docs/*.md docs/research/*.md; do
            out="_site/${file%.md}.html"
            mkdir -p "$(dirname "$out")"
            pandoc "$file" --standalone --metadata title=Conduit -o "$out"
          done
          cp -r spec _site/spec
          # The links in the documents point at the markdown; the site
          # serves the HTML.
          find _site -name '*.html' -print0 | xargs -0 sed -i -e 's|\.md)|.html)|g'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
