[workspace]
resolver = "2"
members = [
    "crates/conduit-protocol",
    "crates/conduit-broker",
    "crates/conduit-client",
    "crates/conduit-near-end",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maceip/conduit"

[workspace.dependencies]
aes-gcm = "0.10"
base64-url = "3"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
